# Deletes claude/* branches whose work is already in the default branch.
# A branch counts as done when main already contains it (merged, rebased or
# cherry-picked) or when merging it into main would change nothing (squashed).
# Branches with an open PR, unmerged commits, or a merge conflict are kept.
name: Clean up merged branches

on:
  schedule:
    - cron: '7 6 * * *' # nightly, ~11pm US Pacific
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged claude/* branches
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          base_tree=$(git rev-parse "$BASE^{tree}")
          open=$(gh pr list --state open --limit 500 --json headRefName -q '.[].headRefName')

          merged() {
            [ "$(git cherry "$BASE" "$1" | grep -c '^+')" = 0 ] && return 0
            local tree
            tree=$(git merge-tree --write-tree "$BASE" "$1" 2>/dev/null) && [ "$tree" = "$base_tree" ]
          }

          dels=()
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/claude/'); do
            b=${ref#origin/}
            if grep -qxF "$b" <<<"$open"; then echo "keep   $b (open PR)"
            elif merged "$ref"; then echo "delete $b"; dels+=("$b")
            else echo "keep   $b (unmerged work)"
            fi
          done

          if [ ${#dels[@]} -gt 0 ]; then
            git push origin --delete "${dels[@]}"
          fi
